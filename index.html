<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d25">
  <title>Anti Enhancement | Free Key</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; padding: 28px 18px;
      display: grid; place-items: center; overflow-x: hidden;
      font-family: Inter, Segoe UI, Arial, sans-serif; color: #f7f8ff;
      background: radial-gradient(ellipse at 50% 110%, #263e83 0%, transparent 52%),
                  radial-gradient(ellipse at 8% 12%, #243e80 0%, transparent 34%),
                  radial-gradient(ellipse at 95% 24%, #39266e 0%, transparent 34%), #080d25;
    }
    #stars { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .aurora { position: fixed; width: 55vw; height: 55vw; min-width: 360px; min-height: 360px; border-radius: 50%; filter: blur(95px); opacity: .2; pointer-events: none; z-index: 0; animation: drift 18s ease-in-out infinite alternate; }
    .aurora.a { top: -28%; left: -18%; background: #668aff; }
    .aurora.b { right: -20%; bottom: -30%; background: #a16bff; animation-delay: -7s; }
    @keyframes drift { from { transform: translate3d(-2%, -1%, 0) scale(.95); } to { transform: translate3d(9%, 8%, 0) scale(1.12); } }
    .grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .15;
      background-image: linear-gradient(rgba(144,169,255,.14) 1px, transparent 1px), linear-gradient(90deg, rgba(144,169,255,.14) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: radial-gradient(ellipse at center, black 0%, transparent 78%);
    }
    .card {
      position: relative; z-index: 1; width: min(100%, 480px); padding: 34px 30px 25px;
      text-align: center; overflow: hidden; border-radius: 26px;
      border: 1px solid rgba(184,201,255,.24);
      background: linear-gradient(145deg, rgba(29,42,91,.78), rgba(15,21,53,.78));
      box-shadow: 0 28px 100px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.09);
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    }
    .card::before { content: ""; position: absolute; top: 0; left: 12%; right: 12%; height: 1px; background: linear-gradient(90deg, transparent, #b7c9ff, transparent); }
    .brand { color: #aebfff; font-size: 11px; font-weight: 800; letter-spacing: 5px; margin: 0 0 25px; }
    .key-icon { width: 72px; height: 72px; margin: 0 auto 19px; display: grid; place-items: center; border-radius: 22px; font-size: 30px;
      background: linear-gradient(145deg, rgba(139,164,255,.28), rgba(104,91,219,.13)); border: 1px solid rgba(190,204,255,.28);
      box-shadow: 0 0 35px rgba(111,137,255,.18), inset 0 1px rgba(255,255,255,.15); }
    h1 { margin: 0; font-size: clamp(28px, 6vw, 35px); letter-spacing: -.8px; }
    .description { color: #aab5d8; font-size: 13px; line-height: 1.7; margin: 12px 0 25px; }
    .timer-box { border: 1px solid rgba(149,170,255,.17); border-radius: 17px; padding: 17px 12px 15px; margin-bottom: 23px; background: rgba(5,10,32,.36); }
    .timer-label { color: #8295d2; font-size: 10px; letter-spacing: 3px; font-weight: 800; margin-bottom: 10px; }
    #timer { font: 700 clamp(33px, 8vw, 43px)/1.2 "Courier New", monospace; letter-spacing: 2px; font-variant-numeric: tabular-nums; text-shadow: 0 0 24px rgba(133,157,255,.23); }
    #timer.expired { color: #ff9da9; font: 800 25px/1.4 Inter, Segoe UI, Arial, sans-serif; letter-spacing: 0; }
    .timer-note { margin-top: 9px; font-size: 11px; color: #7180ad; }
    .key-label { text-align: left; margin: 0 0 9px 2px; color: #aebbe4; font-size: 10px; letter-spacing: 2px; font-weight: 800; }
    .key-box { display: flex; align-items: center; gap: 8px; padding: 10px; margin-bottom: 13px; border: 1px solid rgba(150,172,255,.2); border-radius: 13px; background: rgba(4,9,28,.4); }
    #keyText { min-width: 0; flex: 1; overflow-wrap: anywhere; text-align: left; font: 12px/1.6 "Courier New", monospace; color: #dce4ff; }
    button { border: 0; font-family: inherit; font-weight: 800; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease; }
    button:hover { transform: translateY(-2px); }
    button:active { transform: scale(.99); }
    button:focus-visible, a:focus-visible { outline: 2px solid #c7d4ff; outline-offset: 4px; }
    #copyButton { flex-shrink: 0; padding: 10px 13px; border-radius: 9px; color: #eaf0ff; background: #273866; border: 1px solid rgba(186,202,255,.22); font-size: 11px; }
    #mainCopyButton { width: 100%; padding: 15px; border-radius: 12px; color: #111b42; background: linear-gradient(110deg, #e1e8ff, #a9bdff); box-shadow: 0 8px 28px rgba(99,127,255,.18); font-size: 13px; }
    button:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
    #status { min-height: 19px; margin-top: 11px; font-size: 12px; color: #b7c8ff; }
    .back-link { display: inline-flex; align-items: center; gap: 7px; margin-top: 17px; color: #aab8e7; font-size: 12px; text-decoration: none; transition: color .2s; }
    .back-link:hover { color: white; }
    .footer { margin-top: 25px; color: #65739f; font-size: 10px; letter-spacing: .4px; }
    @media (max-width: 420px) { .card { padding: 28px 19px 22px; } .brand { letter-spacing: 3px; } .key-box { gap: 6px; } #copyButton { padding: 10px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="aurora a"></div><div class="aurora b"></div><div class="grid"></div>

  <main class="card">
    <div class="brand">ANTI ENHANCEMENT</div>
    <div class="key-icon" aria-hidden="true">✦</div>
    <h1>Free Key</h1>
    <p class="description">Your access key is ready.<br>Copy it before the timer expires.</p>

    <section class="timer-box" aria-label="Key countdown">
      <div class="timer-label">TIME REMAINING</div>
      <div id="timer" role="timer" aria-live="off">24:00:00</div>
      <div class="timer-note">24-hour access period</div>
    </section>

    <div class="key-label">YOUR ACCESS KEY</div>
    <div class="key-box">
      <div id="keyText">jhiqefheashlifllhsafhhjqhjefahsljf</div>
      <button id="copyButton" type="button">COPY</button>
    </div>
    <button id="mainCopyButton" type="button">Copy Key</button>
    <div id="status" role="status" aria-live="polite"></div>

    <a class="back-link" href="https://koyo141013.github.io/anti-rival-get-key">← Back to Home</a>
    <div class="footer">© 2026 Anti Enhancement</div>
  </main>

  <script>
    "use strict";
    const ACCESS_KEY = "jhiqefheashlifllhsafhhjqhjefahsljf";
    const DURATION_MS = 24 * 60 * 60 * 1000;
    const STORAGE_KEY = "antiEnhancementKeyExpiresAt";
    const timerElement = document.getElementById("timer");
    const keyText = document.getElementById("keyText");
    const copyButton = document.getElementById("copyButton");
    const mainCopyButton = document.getElementById("mainCopyButton");
    const statusElement = document.getElementById("status");
    keyText.textContent = ACCESS_KEY;

    function resetExpirationTime() {
      const expiry = Date.now() + DURATION_MS;

      try {
        localStorage.setItem(STORAGE_KEY, String(expiry));
      } catch (error) {
        // If localStorage is unavailable, keep the reset time for this page session.
        window.sessionExpiration = expiry;
      }

      return expiry;
    }

    // Reset the existing expiry timestamp now, starting a fresh 24-hour period.
    const expiresAt = resetExpirationTime();

    function updateTimer() {
      const remaining = Math.max(0, expiresAt - Date.now());
      if (remaining <= 0) {
        timerElement.textContent = "EXPIRED";
        timerElement.classList.add("expired");
        copyButton.disabled = true;
        mainCopyButton.disabled = true;
        statusElement.textContent = "This timer has expired. A new key must be issued.";
        return;
      }
      const total = Math.floor(remaining / 1000);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;
      timerElement.textContent = [hours, minutes, seconds].map(n => String(n).padStart(2, "0")).join(":");
    }

    async function copyKey() {
      if (Date.now() >= expiresAt) { updateTimer(); return; }
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(ACCESS_KEY);
        } else {
          const field = document.createElement("textarea");
          field.value = ACCESS_KEY; field.readOnly = true;
          field.style.position = "fixed"; field.style.opacity = "0";
          document.body.appendChild(field); field.select();
          const copied = document.execCommand("copy"); field.remove();
          if (!copied) throw new Error("Clipboard unavailable");
        }
        statusElement.textContent = "✓ Key copied to clipboard!";
      } catch (error) {
        statusElement.textContent = "Copy failed. Please select and copy the key manually.";
      }
    }
    copyButton.addEventListener("click", copyKey);
    mainCopyButton.addEventListener("click", copyKey);
    updateTimer();
    setInterval(updateTimer, 1000);

    // Lightweight animated starfield background.
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let stars = [];
    let width = 0, height = 0, dpr = 1;
    function resizeStars() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth; height = window.innerHeight;
      canvas.width = Math.floor(width * dpr); canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + "px"; canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      stars = Array.from({ length: Math.min(150, Math.floor(width * height / 6500)) }, () => ({
        x: Math.random() * width, y: Math.random() * height,
        r: Math.random() * 1.35 + .25, alpha: Math.random() * .65 + .2,
        speed: Math.random() * .18 + .025, phase: Math.random() * Math.PI * 2
      }));
    }
    function drawStars(time = 0) {
      ctx.clearRect(0, 0, width, height);
      for (const star of stars) {
        const twinkle = reducedMotion ? 1 : .65 + .35 * Math.sin(time * .001 * star.speed * 8 + star.phase);
        ctx.beginPath(); ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(208,222,255,${star.alpha * twinkle})`; ctx.fill();
        if (!reducedMotion) { star.y -= star.speed * .12; if (star.y < -2) star.y = height + 2; }
      }
      if (!reducedMotion) requestAnimationFrame(drawStars);
    }
    resizeStars();
    if (reducedMotion) drawStars(); else requestAnimationFrame(drawStars);
    window.addEventListener("resize", () => { resizeStars(); if (reducedMotion) drawStars(); });
  </script>
</body>
</html>
